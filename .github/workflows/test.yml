name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build (warnings are errors)
        run: dotnet build coppercli.sln -warnaserror

      - name: Test
        run: dotnet test coppercli.Tests/coppercli.Tests.csproj --no-build --verbosity normal
